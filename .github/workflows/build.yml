# ============================================================================
#  视频展台 · 云构建流水线
#
#  为什么需要它：
#    MSI / EXE 只能在 Windows 上打包（详见 docs/BUILD_ENVIRONMENT.md）：
#      · C++ 启动器需要 MSVC（Windows-only 编译器）
#      · WinUI 3 项目被 Windows App SDK 限制为「仅可在 Windows 宿主上构建」
#      · Inno Setup (ISCC.exe) / signtool 均为原生 Windows 程序
#    因此把打包搬到 GitHub 的 windows-latest runner 上，本地无需安装任何工具链。
#
#  ★ 为什么把构建拆成 4 个 step：
#    GitHub 的失败注解（annotations）只会捕获 MSBuild / 编译器的结构化输出，
#    ISCC.exe 之类的普通控制台程序报错只会写 stdout，不会变成注解。
#    拆成独立 step 后，"哪一步红了"本身就是最精确的定位信息。
#
#  产物：
#    · vdc-1.0.0-x64.msi          （WiX v4 安装包）
#    · vdc-1.0.0-x64-setup.exe    （Inno Setup 安装包）
#    · 视频展台-便携版（dist/app 整目录，可直接拷贝运行）
# ============================================================================

name: 构建视频展台

on:
  push:
    branches: [main, master]
    tags: ['v*']
    # CI 会把构建产物提交到 dev/ —— 必须忽略该目录，
    # 否则每次提交产物都会再次触发构建，形成无限循环。
    # （提交信息里另外带了 [skip ci]，双保险）
    paths-ignore:
      - 'dev/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_to_dev:
        description: '把构建产物提交到仓库 dev/ 文件夹'
        type: boolean
        default: true

permissions:
  contents: write      # 打 tag 时创建 Release

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: 'Release'
  # pwsh 调用 build.ps1 的统一前缀
  BUILD_CMD: pwsh -ExecutionPolicy Bypass -File ./build/build.ps1 -SkipIcon

jobs:
  build-windows:
    name: 构建 Windows 安装包（MSI + EXE）
    runs-on: windows-latest

    steps:
      # ══════════ 准备 ══════════
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 规范化 C++ 源文件行尾 ────────────────────────────────────────────
      #  MSVC 工具链在 Windows 上按 CRLF 处理最稳；rc.exe 对
      #  「UTF-8 无 BOM + LF + 中文」的解析有缺陷，会报
      #      RC1004: unexpected end of file found
      #  .gitattributes 已声明 eol=crlf，这里再做一次兜底，保证万无一失。
      - name: 规范化 C++ 源文件行尾（CRLF）
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $n = 0
          Get-ChildItem -Recurse -Include *.h,*.cpp,*.rc,*.def -File | ForEach-Object {
              $t = [IO.File]::ReadAllText($_.FullName)
              $t = $t -replace "`r`n", "`n"
              $t = $t -replace "`n", "`r`n"
              # ★ rc.exe 要求 .rc / .h 必须以换行结束，否则最后一条预处理指令
              #   没有终止符，预处理器一路读到物理 EOF，报
              #       RC1004: unexpected end of file found
              if (-not $t.EndsWith("`r`n")) { $t += "`r`n" }
              [IO.File]::WriteAllText($_.FullName, $t, $utf8NoBom)
              $n++
          }
          Write-Host "已规范化 $n 个 C++ 源文件（CRLF + 末尾换行）"
        shell: pwsh

      # ── 规范化 C++ 源文件行尾 ────────────────────────────────────────────

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 配置 MSBuild（VS2022）
        uses: microsoft/setup-msbuild@v2

      - name: 安装 WiX v4
        run: dotnet tool install --global wix

      - name: 安装 Inno Setup 6
        run: choco install innosetup --no-progress -y
        shell: pwsh

      # ── 准备简体中文语言文件 ────────────────────────────────────────────
      #  Inno Setup 官方安装包不含 ChineseSimplified.isl（社区维护）。
      #  setup.iss 里用 ISPP 的 FileExists 做了条件判断，因此这一步失败
      #  也不会中断构建，只是安装向导会退回英文。
      - name: 准备 Inno Setup 简体中文语言文件
        continue-on-error: true
        run: |
          $langDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          $dst = Join-Path $langDir 'ChineseSimplified.isl'
          if (Test-Path $dst) {
              Write-Host "已存在：$dst"
              exit 0
          }
          $urls = @(
              'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl',
              'https://raw.githubusercontent.com/jrsoftware/issrc/master/Files/Languages/Unofficial/ChineseSimplified.isl'
          )
          foreach ($u in $urls) {
              try {
                  Invoke-WebRequest -UseBasicParsing -Uri $u -OutFile $dst -TimeoutSec 30
                  Write-Host "已下载：$dst"
                  exit 0
              }
              catch {
                  Write-Host "下载失败（$u）：$($_.Exception.Message)"
              }
          }
          Write-Host "未能获取 ChineseSimplified.isl，安装向导将使用英文。"
        shell: pwsh

      - name: 打印环境信息
        run: |
          Write-Host "--- dotnet ---"
          dotnet --version
          Write-Host "--- msbuild ---"
          msbuild -version
          Write-Host "--- ISCC ---"
          Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" | Select-Object FullName
        shell: pwsh

      # ══════════ ① 启动器（C++）══════════
      - name: ① 编译启动器（原生 Win32 C++）
        run: ${{ env.BUILD_CMD }} -Configuration ${{ env.CONFIGURATION }} -Stage Launcher
        shell: pwsh

      # ══════════ ② 主程序（WinUI 3）══════════
      - name: ② 发布主程序（WinUI 3 自包含）
        run: ${{ env.BUILD_CMD }} -Configuration ${{ env.CONFIGURATION }} -Stage App
        shell: pwsh

      # ══════════ ③ MSI ══════════
      - name: ③ 打包 MSI（WiX v4）
        run: ${{ env.BUILD_CMD }} -Stage Msi
        shell: pwsh

      # ══════════ ④ EXE ══════════
      - name: ④ 打包 EXE（Inno Setup 6）
        run: ${{ env.BUILD_CMD }} -Stage Exe
        shell: pwsh

      # ══════════ 诊断（失败时）══════════
      - name: 诊断信息（仅在失败时）
        if: failure()
        run: |
          Write-Host "--- 工作目录树 ---"
          if (Test-Path dist) { Get-ChildItem dist -Recurse -File | Select-Object -First 40 FullName, Length }
          else { Write-Host "(dist 不存在，构建在更早阶段失败)" }
          Write-Host "--- build/out ---"
          if (Test-Path build\out) { Get-ChildItem build\out -Recurse -File | Select-Object -First 40 FullName }
          else { Write-Host "(build/out 不存在)" }
        shell: pwsh

      # ══════════ 收集产物 ══════════
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 视频展台-安装包
          path: |
            dist/*.msi
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: 上传便携版
        uses: actions/upload-artifact@v4
        with:
          name: 视频展台-便携版
          path: dist/app/**
          if-no-files-found: error
          retention-days: 30

      # ══════════ 打 tag 时挂到 Release ══════════
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*-setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ══════════ 把产物提交到仓库 dev/ ══════════
      #  目的：GitHub 的 Artifacts 需要登录才能下载；提交进仓库后，
      #        任何人（包括手机浏览器、未登录状态）都能直接从 dev/ 取到安装包。
      #
      #  只在主干分支的 push、或手动触发（且勾选了开关）时执行 ——
      #  PR 的 GITHUB_TOKEN 是只读的，跑不通；tag 构建处于 detached HEAD，也推不了。
      - name: 发布产物到仓库 dev/
        if: |
          success()
          && (github.event_name == 'workflow_dispatch' && inputs.publish_to_dev
              || github.event_name == 'push'
                 && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Path dev -Force | Out-Null
          Remove-Item dev\* -Recurse -Force -ErrorAction SilentlyContinue

          # 只收录安装包。便携版是 200 MB+ 的目录树（300 多个文件），
          # 既不适合入库，也远超 GitHub 的单文件/仓库体积预期。
          Get-ChildItem dist -File |
              Where-Object { $_.Extension -in '.msi', '.exe' } |
              ForEach-Object { Copy-Item $_.FullName dev\ -Force }

          # ⚠ GitHub 的单文件硬上限是 100 MB，超限的 push 会被直接拒绝。
          #   这里主动剔除并给出警告，避免整个发布步骤失败。
          $limitMb = 95
          foreach ($f in (Get-ChildItem dev -File)) {
              $mb = [Math]::Round($f.Length / 1MB, 1)
              if ($mb -gt $limitMb) {
                  Write-Host ("::warning::" + $f.Name + " 为 " + $mb + " MB，超过 GitHub 单文件上限，已跳过")
                  Remove-Item $f.FullName -Force
              }
              else {
                  Write-Host ("  " + $f.Name + "  " + $mb + " MB")
              }
          }

          # 生成目录清单
          $lines = @(
              '# dev —— 构建产物',
              '',
              '> ⚠ **本目录由 CI 自动生成，请勿手工修改**（每次构建会被整体覆盖）。',
              '',
              '这里的安装包来自 GitHub Actions 的自动构建，',
              '提交进仓库是为了让**未登录**的访问者（含手机浏览器）也能直接下载。',
              '',
              '| 文件 | 大小 |',
              '| --- | --- |'
          )
          foreach ($f in (Get-ChildItem dev -File)) {
              $lines += ('| `' + $f.Name + '` | ' + [Math]::Round($f.Length / 1MB, 1) + ' MB |')
          }
          $lines += @(
              '',
              '---',
              '',
              '* 构建时间：' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' UTC',
              '* 源码提交：`' + $env:GITHUB_SHA + '`',
              '* 流水线：' + $env:GITHUB_SERVER_URL + '/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID,
              '',
              '> 需要历史版本或更小的分发体积，请使用 **Releases** 页面；',
              '> 需要便携版（解压即用）请到 Actions 的 Artifacts 下载。'
          )
          [IO.File]::WriteAllText(
              (Join-Path (Get-Location) 'dev/README.md'),
              ($lines -join "`n"),
              (New-Object System.Text.UTF8Encoding $false))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add dev/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              Write-Host 'dev/ 内容没有变化，跳过提交。'
              exit 0
          }

          $short = $env:GITHUB_SHA.Substring(0, 7)
          # [skip ci] 防止这次提交再次触发构建（与 paths-ignore 双保险）
          git commit -m "CI: 更新 dev/ 安装包（$short）[skip ci]"
          git push
        shell: pwsh